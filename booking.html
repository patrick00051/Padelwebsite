<!DOCTYPE html>
<html>
<head>
<title>Padel Clubs</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
    <h2>🎾 YALLA PADEL!</h2>
</div>

<h1>PADEL CLUBS</h1>

<div class="container">

    <div class="card">
        <div class="img-box">
            <img src="OIP (3).jfif">
            <span class="price">450 EGP/HOUR</span>
            <button onclick="selectClub('Shams Club')">Shams Club</button>
        </div>
    </div>

    <div class="card">
        <div class="img-box">
            <img src="OIP (4).jfif">
            <span class="price">450 EGP/HOUR</span>
            <button onclick="selectClub('Wadi Degla')">Wadi Degla</button>
        </div>
    </div>

    <div class="card">
        <div class="img-box">
            <img src="OIP.jfif">
            <span class="price">450 EGP/HOUR</span>
            <button onclick="selectClub('HPark')">HPark</button>
        </div>
    </div>

    <div class="card">
        <div class="img-box">
            <img src="OIP (2).jfif">
            <span class="price">450 EGP/HOUR</span>
            <button onclick="selectClub('Cairo Stadium')">Cairo Stadium</button>
        </div>
    </div>

    <div class="card">
        <div class="img-box">
            <img src="OIP (1).jfif">
            <span class="price">450 EGP/HOUR</span>
            <button onclick="selectClub('Smash Club')">Smash Club</button>
        </div>
    </div>

</div>

<script src="script.js"></script>


</body>
</html>
