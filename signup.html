<!Doctype html>
<head>
<link rel="stylesheet" href="signup.css">
</head>

<div class="container">
    
 <div class="loginbox">
    <P id="title"><b>Create Account</b></P>
    <div class="steps">
  <div class="step active">
    <div class="circle">1</div>
    <p>Signup</p>
  </div>

  <div class="step">
    <div class="circle">2</div>
    <p>OTP</p>
  </div>

  <div class="step">
    <div class="circle">3</div>
    <p>Complete</p>
  </div>
</div>
    <p>Go ahead and join our family now</p>

<form  onsubmit="return validate()">
<input type="tel" id="pho" name="ph"  placeholder="phone number">
<span id="phoneError" class="error"></span>

<br>
<input type="password" id="password" name="pass" placeholder="password">
 <span id="passwordError" class="error"></span>
 <br>
 <input type="password" id="confirm" placeholder="confirmation password">
  <span id="confirmError" class="error"></span>
 <br>


 
<button id="button" type="submit">Signup</button>
<br>
 <p>Already have an account ?<a href="login.html">Login</a></p>




</form>
</div>
</div>

<script>

function validate(){
    let valid = true;
let phone= document.getElementById('pho').value;
let password = document.getElementById("password").value;
let confirmPassword = document.getElementById("confirm").value;

let phoneRegex = /^[0-9]{10,15}$/;


document.getElementById("phoneError").innerText="";
document.getElementById("passwordError").innerText="";
document.getElementById("confirmError").innerText="";


 if(password.length < 8){
        document.getElementById("passwordError").innerText="Password must be at least 8 characters.";
        valid=false;
    }

    if(!phoneRegex.test(phone)){
        document.getElementById("phoneError").innerText="Phone must be 10-15 digits.";
        valid=false;
    }
    if(password !== confirmPassword){
        document.getElementById("confirmError").innerText="Passwords do not match.";
        valid=false;
    }
      if(valid){
        window.location.href = "otp.html";
    }
return false;
}


</script>
</body>
